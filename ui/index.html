<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CYR@</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, "Segoe UI Variable",
             "Segoe UI", system-ui, sans-serif;
             background: #0d1117; color: #e6edf3;
             -webkit-font-smoothing: antialiased; }
      @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes slideUp { from { opacity: 0;
        transform: translateY(10px) }
        to { opacity: 1; transform: translateY(0) } }
      @keyframes slideDown { from { opacity: 0;
        transform: translateY(-8px) }
        to { opacity: 1; transform: translateY(0) } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes bounce { 0%, 80%, 100% { transform: translateY(0) }
        40% { transform: translateY(-5px) } }
      @keyframes glow { 0%,100% { box-shadow: 0 0 0 0
        rgba(52,226,178,0) } 50% { box-shadow: 0 0 18px 2px
        rgba(52,226,178,0.18) } }
      .anim-in { animation: slideUp .28s cubic-bezier(.2,.8,.2,1) }
      .anim-fade { animation: fadeIn .4s ease }
      .anim-down { animation: slideDown .2s ease }
      .spin { animation: spin 1s linear infinite }
      .pulse { animation: pulse 1.2s infinite }
      .dot { display: inline-block; width: 6px; height: 6px;
        border-radius: 50%; background: #34e2b2;
        animation: bounce 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: .15s }
      .dot:nth-child(3) { animation-delay: .3s }
      ::-webkit-scrollbar { width: 8px }
      ::-webkit-scrollbar-thumb { background: #2a3441;
        border-radius: 8px; border: 2px solid transparent;
        background-clip: content-box }
      ::-webkit-scrollbar-thumb:hover { background: #3a4757;
        background-clip: content-box }
      ::-webkit-scrollbar-track { background: transparent }
      textarea:focus, input:focus, select:focus {
        outline: none }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
