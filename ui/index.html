<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CYR@</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0;
        font-family: "Cascadia Code", "Segoe UI Variable",
        "Segoe UI", system-ui, sans-serif;
        background: #0f0f11; color: #dcdce0;
        -webkit-font-smoothing: antialiased; }
      @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
      @keyframes slideUp { from { opacity: 0;
        transform: translateY(6px) }
        to { opacity: 1; transform: none } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes pulse { 0%,100% { opacity: 1 }
        50% { opacity: .4 } }
      .anim-in { animation: slideUp .2s ease }
      .anim-fade { animation: fadeIn .3s ease }
      .spin { animation: spin 1s linear infinite }
      .pulse { animation: pulse 1.4s infinite }
      ::-webkit-scrollbar { width: 6px; height: 6px }
      ::-webkit-scrollbar-thumb { background: #2a2a2e;
        border-radius: 3px }
      ::-webkit-scrollbar-track { background: transparent }
      ::selection { background: #31555f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
