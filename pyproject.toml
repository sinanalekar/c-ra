[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-environment"
version = "0.1.0"
description = "VERITAS environment: local-first autonomous security-research operating environment - coordinator, engine adapters, evidence gates, desktop shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
veritas-environment = "environment.server:main"

[tool.setuptools.packages.find]
include = ["environment*"]
