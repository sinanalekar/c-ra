[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyr"
version = "1.0.0"
description = "CYR@ - local-first desktop agent harness for authorized security research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
cyr = "environment.server:main"

[tool.setuptools.packages.find]
include = ["environment*"]